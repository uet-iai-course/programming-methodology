<svg xmlns="http://www.w3.org/2000/svg" width="477" height="352" viewBox="0 0 477 352">
  <defs>
    <style>
      .box {
        fill: #fff;
        stroke: #111;
        stroke-width: 1.6;
      }
      .divider {
        stroke: #111;
        stroke-width: 1.4;
      }
      .inherit {
        stroke: #111;
        stroke-width: 2.4;
        stroke-dasharray: 10 8;
        fill: none;
      }
      .title {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 22px;
        font-weight: 700;
        fill: #111;
        text-anchor: middle;
      }
      .stereo {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 18px;
        font-style: italic;
        fill: #333;
        text-anchor: middle;
      }
      .method {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 18px;
        fill: #111;
      }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect class="box" x="153" y="8" width="143" height="96" filter="url(#shadow)"/>
  <line class="divider" x1="153" y1="72" x2="296" y2="72"/>
  <text class="stereo" x="224.5" y="32">&lt;&lt;interface&gt;&gt;</text>
  <text class="title" x="224.5" y="58">Shape</text>
  <text class="method" x="157" y="94">+area():int</text>

  <rect class="box" x="12" y="218" width="198" height="97" filter="url(#shadow)"/>
  <line class="divider" x1="12" y1="262" x2="210" y2="262"/>
  <text class="title" x="111" y="246">Square</text>
  <text class="method" x="16" y="286">+setSize(int size)</text>
  <text class="method" x="16" y="308">+area(): int</text>

  <rect class="box" x="239" y="218" width="226" height="120" filter="url(#shadow)"/>
  <line class="divider" x1="239" y1="262" x2="465" y2="262"/>
  <text class="title" x="352" y="246">Rectangle</text>
  <text class="method" x="243" y="286">+setWidth(int width)</text>
  <text class="method" x="243" y="308">+setHeight(int height)</text>
  <text class="method" x="243" y="330">+area(): int</text>

  <line class="inherit" x1="111" y1="218" x2="111" y2="161"/>
  <line class="inherit" x1="352" y1="218" x2="352" y2="161"/>
  <line class="inherit" x1="111" y1="161" x2="224.5" y2="161"/>
  <line class="inherit" x1="224.5" y1="161" x2="352" y2="161"/>
  <line class="inherit" x1="224.5" y1="161" x2="224.5" y2="135"/>

  <polygon points="224.5,108 208.5,135 240.5,135" fill="#fff" stroke="#111" stroke-width="2.4"/>
</svg>
